services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER=true

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared
